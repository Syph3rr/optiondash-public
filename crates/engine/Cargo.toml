[package]
name = "optiondash-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Option pricing engine: P&L grid, position Greeks, IV solving (OptionStratLib)"

[lib]
name = "engine"

[dependencies]
libm = "0.2.16"
optionstratlib = { version = "0.23.0", default-features = false, features = ["pricing"] }
rayon = "1.12.0"
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
